<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#52B788"></stop><stop offset="100%" stop-color="#74C69D"></stop></linearGradient>
    <style>
      .orb { transform-box: view-box; transform-origin: 48px 48px; }
      .cp  { transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) {
        .orb { animation: sqOrbit 7s linear infinite; }
        .cp  { animation: sqCore 3.2s ease-in-out infinite; }
        .np  { animation: sqNode 3.2s ease-in-out infinite; }
      }
      @keyframes sqOrbit { to { transform: rotate(360deg); } }
      @keyframes sqCore  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
      @keyframes sqNode  { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </defs>
  <ellipse cx="48" cy="48" rx="30" ry="12" fill="none" stroke="url(#b)" stroke-width="3" opacity="0.5" transform="rotate(-32 48 48)"></ellipse>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#FFFFFF" stroke-width="5.5"></circle>
  <line x1="74" y1="74" x2="81" y2="81" stroke="url(#b)" stroke-width="6" stroke-linecap="round"></line>
  <circle class="np" cx="85.5" cy="85.5" r="5.5" fill="url(#b)"></circle>
  <circle class="cp" cx="48" cy="48" r="9" fill="#FFFFFF"></circle>
  <g class="orb"><circle cx="69" cy="69" r="5" fill="url(#b)"></circle></g>
</svg>
