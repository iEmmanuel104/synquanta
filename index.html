<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags. NOTE: title, description and canonical are owned
         per-route by src/components/Seo.tsx (react-helmet-async) — they are
         intentionally NOT duplicated here, to avoid two conflicting canonical/
         description tags in the rendered DOM. The values below are the initial
         pre-React paint only (Helmet replaces <title> on mount). The og:/twitter
         block further down is kept static as the homepage social-card fallback
         for non-JS scrapers. -->
    <title>SynQuanta Technologies | Product studio — platforms, apps & software</title>
    <meta name="keywords" content="product studio, software development, web applications, mobile app development, platforms, custom software, AI, MVP, startups" />
    <meta name="author" content="SynQuanta Technologies Ltd" />
    <meta name="theme-color" content="#1B4332" />

    <!-- Favicon — Orbit Atom (SVG + PNG fallbacks) -->
    <link rel="icon" type="image/svg+xml" href="/brand-kit/orbit-atom-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand-kit/png/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand-kit/png/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand-kit/png/app-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.synquanta.com/" />
    <meta property="og:title" content="SynQuanta Technologies | Product studio" />
    <meta property="og:description" content="A research-led product studio — we design platforms, build web & mobile products, and bring startup ideas to life." />
    <meta property="og:image" content="https://www.synquanta.com/brand-kit/png/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="SynQuanta Technologies" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.synquanta.com/" />
    <meta name="twitter:title" content="SynQuanta Technologies | Product studio" />
    <meta name="twitter:description" content="A research-led product studio — we design platforms, build web & mobile products, and bring startup ideas to life." />
    <meta name="twitter:image" content="https://www.synquanta.com/brand-kit/png/og-image-1200x630.png" />

    <!-- Fonts — self-hosted woff2 (declared in src/styles/fonts.css). Preload
         the above-the-fold faces (body Inter + Clash Display 600 headline) so
         text paints without a render-blocking external stylesheet round-trip. -->
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Home hero (LCP) — fetch in parallel with the JS bundle instead of
         waiting for React to mount and discover it. webp (not avif): Safari
         decodes webp markedly faster. Costs 68KB on direct inner-page entries;
         the home route is the overwhelming entry point. -->
    <link rel="preload" href="/images/hero-abstract.webp" as="image" type="image/webp" fetchpriority="high" />

    <!-- Canonical is set per-route by Seo.tsx (react-helmet-async). -->

    <!-- Structured data (Organization + WebSite) — static so it is present for
         every route regardless of JS. Per-page <title>/description/OG are set
         dynamically via src/components/Seo.tsx. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.synquanta.com/#organization",
            "name": "SynQuanta Technologies",
            "legalName": "SynQuanta Technologies Ltd",
            "url": "https://www.synquanta.com/",
            "logo": "https://www.synquanta.com/brand-kit/png/app-icon-180.png",
            "image": "https://www.synquanta.com/brand-kit/png/og-image-1200x630.png",
            "email": "info@synquanta.com",
            "description": "A research-led product studio. We design platforms, build web & mobile products, and bring startup ideas to life — from first sketch to launch.",
            "sameAs": [],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "email": "info@synquanta.com",
              "availableLanguage": "English"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.synquanta.com/#website",
            "url": "https://www.synquanta.com/",
            "name": "SynQuanta Technologies",
            "publisher": { "@id": "https://www.synquanta.com/#organization" }
          }
        ]
      }
    </script>

    <!-- Pre-hydration shell. Every route opens on a dark hero, but until the
         JS bundle parses and React mounts, #root is empty and the body is
         off-white — on a slow round-trip (and on Safari reloads, which
         revalidate subresources) that reads as 1–3s of blank white page.
         This inline-styled overlay paints WITH the HTML: dark brand canvas +
         the self-animating Orbit Atom mark. Pure CSS hides it the instant
         React commits its first frame (#root gains children). -->
    <style>
      html { background-color: #1b4332; }
      #sq-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background-color: #1b4332;
      }
      #root:not(:empty) ~ #sq-boot { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="sq-boot" aria-hidden="true">
      <!-- Orbit Atom mark inlined (1.5KB) — zero extra requests, animates from
           the very first frame. Source: /brand-kit/orbit-atom-animated-white.svg -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="72" height="72">
        <defs>
          <linearGradient id="sqb" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#52B788"></stop><stop offset="100%" stop-color="#74C69D"></stop></linearGradient>
          <style>
            .sq-orb { transform-box: view-box; transform-origin: 48px 48px; }
            .sq-cp  { transform-box: fill-box; transform-origin: center; }
            @media (prefers-reduced-motion: no-preference) {
              .sq-orb { animation: sqOrbit 7s linear infinite; }
              .sq-cp  { animation: sqCore 3.2s ease-in-out infinite; }
              .sq-np  { animation: sqNode 3.2s ease-in-out infinite; }
            }
            @keyframes sqOrbit { to { transform: rotate(360deg); } }
            @keyframes sqCore  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
            @keyframes sqNode  { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
          </style>
        </defs>
        <ellipse cx="48" cy="48" rx="30" ry="12" fill="none" stroke="url(#sqb)" stroke-width="3" opacity="0.5" transform="rotate(-32 48 48)"></ellipse>
        <circle cx="48" cy="48" r="30" fill="none" stroke="#FFFFFF" stroke-width="5.5"></circle>
        <line x1="74" y1="74" x2="81" y2="81" stroke="url(#sqb)" stroke-width="6" stroke-linecap="round"></line>
        <circle class="sq-np" cx="85.5" cy="85.5" r="5.5" fill="url(#sqb)"></circle>
        <circle class="sq-cp" cx="48" cy="48" r="9" fill="#FFFFFF"></circle>
        <g class="sq-orb"><circle cx="69" cy="69" r="5" fill="url(#sqb)"></circle></g>
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
